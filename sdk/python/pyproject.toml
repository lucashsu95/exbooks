[build-system]
# PEP 639 的 license = "MIT" 表記需要 setuptools >= 77
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-client"
version = "0.1.0"
description = "Reusable OpenAI-compatible vLLM client with dependency injection"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]
optional-dependencies = { dotenv = ["python-dotenv>=1.0"] }

[project.scripts]
ai-ask = "ai_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
