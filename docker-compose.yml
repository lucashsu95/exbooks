services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    mem_limit: 768m
    cpus: "1.00"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-exbook}
      MARIADB_CHARACTER_SET: utf8mb4
      MARIADB_COLLATE: utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    mem_limit: 768m
    cpus: "1.00"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: exbook.prod_settings
      HOME: /app
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

  celery_worker:
    build: .
    restart: unless-stopped
    mem_limit: 768m
    cpus: "1.00"
    command: celery -A exbook worker -l info -c 2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: exbook.prod_settings
    volumes:
      - media_data:/app/media

  celery_beat:
    build: .
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.50"
    command: celery -A exbook beat -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: exbook.prod_settings

  nginx:
    image: nginx:1-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - web
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro

  redis:
    image: redis:7-alpine
    container_name: exbook_redis
    mem_limit: 256m
    cpus: "0.50"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    image: mariadb:10.11
    profiles: ["backup"]
    mem_limit: 256m
    cpus: "0.50"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-exbook}
    volumes:
      - backup_data:/backup
      - ./scripts/backup_mysql.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

  media_backup:
    image: minio/mc
    profiles: ["backup"]
    mem_limit: 256m
    cpus: "0.50"
    depends_on:
      - web
      - minio
    env_file: .env
    volumes:
      - media_data:/media:ro
      - backup_data:/backup
      - ./scripts/backup_media.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.00"
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_backup:
    image: redis:7-alpine
    profiles: ["backup"]
    mem_limit: 256m
    cpus: "0.50"
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    volumes:
      - redis_data:/data
      - backup_data:/backup
      - ./scripts/backup_redis.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    ports:
      - "8025:8025"
    volumes:
      - mailpit_data:/data

volumes:
  db_data:
  mailpit_data:
  static_data:
  media_data:
  redis_data:
  backup_data:
  minio_data:
