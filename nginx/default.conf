upstream django {
    server web:8000;
}

limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # 靜態檔案 — Nginx 直接 serve，不經過 Django
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 使用者上傳檔案 — 透過 MinIO S3 代理
    location /media/ {
        proxy_pass http://minio:9000/exbook-media/;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 受保護的媒體檔案 — 僅限 X-Accel-Redirect 內部轉發
    location /internal-media/ {
        internal;
        proxy_pass http://minio:9000/exbook-media/;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        add_header Cache-Control "private";
    }

    location ~* ^/accounts/(login|signup|password) {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # AI 聊天（SSE 串流）：一輪可能含多次模型呼叫（單次上限 120s），
    # orchestrator 在每次呼叫前送一幀 status，所以兩次讀取之間的最長空檔
    # 是「一次模型呼叫」——read timeout 需大於 120s（預設 60s 會把長回應切斷）。
    # 串流不可被緩衝，否則前端要等整段結束才收到第一個位元組。
    # 時間預算單一來源在 ai/services/chat_orchestrator.py（LLM_CALL_TIMEOUT_SECONDS 等）；
    # 調整那裡的常數時一併確認此處 timeout 仍大於單次模型呼叫上限。
    location /ai/chat/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # 其餘請求轉發給 Gunicorn
    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
