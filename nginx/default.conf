upstream django {
    server web:8000;
}

limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # 靜態檔案 — Nginx 直接 serve，不經過 Django
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 使用者上傳檔案 — 透過 MinIO S3 代理
    location /media/ {
        proxy_pass http://minio:9000/exbook-media/;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        expires 7d;
        add_header Cache-Control "public";
        # 使用者上傳內容：禁止 MIME sniffing，且以 sandbox 執行，避免同源 XSS
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self'" always;
    }

    # 受保護的媒體檔案 — 僅限 X-Accel-Redirect 內部轉發
    location /internal-media/ {
        internal;
        proxy_pass http://minio:9000/exbook-media/;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        add_header Cache-Control "private";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self'" always;
    }

    location ~* ^/accounts/(login|signup|password) {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # REST API 帳密換 JWT — 與登入頁共用 login 限流
    location = /api/token/ {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # 其餘請求轉發給 Gunicorn
    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
