{% extends 'base.html' %}
{% block title %}Exbooks - 即將到期提醒{% endblock %}
{% block content %}
    <!-- Top Navigation -->
    <div class="flex items-center bg-white p-4 pb-2 justify-between sticky top-0 z-50 border-b border-slate-200">
        <a href="{% url 'books:bookshelf' %}"
           aria-label="返回我的書架"
           class="text-slate-900 flex size-12 shrink-0 items-center cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary rounded-lg">
            <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
        </a>
        <h2 class="text-slate-900 text-lg font-bold leading-tight tracking-tight flex-1">即將到期提醒</h2>
        <div class="flex w-12 items-center justify-end">
            <!-- Placeholder for symmetry -->
        </div>
    </div>
    <!-- Filter Tabs with HTMX -->
    <div class="px-4 py-3 bg-white border-b border-slate-200">
        <div class="flex gap-2">
            <a href="?days=7"
               hx-get="?days=7"
               hx-target="#due-soon-content"
               hx-swap="outerHTML transition:true"
               hx-indicator="#global-loader"
               hx-push-url="true"
               class="px-4 py-2 rounded-full text-sm font-medium {% if remind_days == 7 %}bg-primary text-white{% else %}bg-slate-100 text-slate-600 hover:bg-slate-200{% endif %}">
                7 天內
            </a>
            <a href="?days=14"
               hx-get="?days=14"
               hx-target="#due-soon-content"
               hx-swap="outerHTML transition:true"
               hx-indicator="#global-loader"
               hx-push-url="true"
               class="px-4 py-2 rounded-full text-sm font-medium {% if remind_days == 14 %}bg-primary text-white{% else %}bg-slate-100 text-slate-600 hover:bg-slate-200{% endif %}">
                14 天內
            </a>
            <a href="?days=30"
               hx-get="?days=30"
               hx-target="#due-soon-content"
               hx-swap="outerHTML transition:true"
               hx-indicator="#global-loader"
               hx-push-url="true"
               class="px-4 py-2 rounded-full text-sm font-medium {% if remind_days == 30 %}bg-primary text-white{% else %}bg-slate-100 text-slate-600 hover:bg-slate-200{% endif %}">
                30 天內
            </a>
        </div>
    </div>
    <!-- Content (HTMX target) -->
    <div class="px-4 py-4">
        {% include 'books/partials/due_soon_content.html' %}
    </div>
{% endblock %}
