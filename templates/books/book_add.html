{% extends 'base.html' %}
{% load crispy_forms_tags i18n %}
{% block title %}{% trans "Exbooks - 新增書籍" %}{% endblock %}
{% block content %}
    {% include 'books/partials/book_add_page.html' %}
{% endblock %}
{% block extra_js %}
    <script>
        (function() {
            // 事件委派到 document：HTMX 原地重繪表單後，新元素也能觸發
            // 封面上傳欄位顯示控制
            // 初始顯示（還沒查 ISBN），查到封面後隱藏
            window.setCoverFieldVisibility = function(hasCover) {
                var wrapper = document.getElementById('cover-image-wrapper');
                if (!wrapper) return;
                if (hasCover) {
                    wrapper.style.display = 'none';
                    // 清空已選的檔案（避免舊選擇被送出）
                    var input = wrapper.querySelector('input[name="cover_image"]');
                    if (input) input.value = '';
                } else {
                    wrapper.style.display = '';
                }
            };

            // ISBN 清空時顯示封面上傳欄位
            document.addEventListener('input', function(e) {
                if (!e.target.matches || !e.target.matches('input[name="isbn"]')) return;
                if (e.target.value.trim()) return;
                window.setCoverFieldVisibility(false);
                // 清空 ISBN 查詢結果
                var resultDiv = document.getElementById('isbn-result');
                if (resultDiv) resultDiv.innerHTML = '';
            });

            // 書況照片預覽
            document.addEventListener('change', function(e) {
                if (!e.target.matches || !e.target.matches('input[name="photos"]')) return;
                var previewContainer = document.getElementById('photo-preview');
                if (!previewContainer) return;
                previewContainer.innerHTML = '';
                var files = Array.from(e.target.files);
                files.forEach(function(file) {
                    if (file.type.startsWith('image/')) {
                        var reader = new FileReader();
                        reader.onload = function(event) {
                            var div = document.createElement('div');
                            div.className = 'relative';
                            div.innerHTML = '<img src="' + event.target.result + '" alt="書況照片預覽" class="w-full h-24 object-cover rounded-lg">';
                            previewContainer.appendChild(div);
                        };
                        reader.readAsDataURL(file);
                    }
                });
            });
        })();
    </script>
{% endblock %}
