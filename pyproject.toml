[project]
name = "exbook"
version = "0.1.0"
description = "共享書籍平臺 — 公益性質的去中心化書籍共享社群"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.3",
    "django>=5.2,<5.3",
    "rules>=3.5",
    "PyJWT>=2.8",
    "pillow>=11.0",
    "python-dotenv>=1.0",
    "django-allauth>=65.0",
    "django-crispy-forms>=2.0",
    "crispy-tailwind>=1.0",
    "requests>=2.32",
    "httpx>=0.27",
    "django-fsm-2>=3.0.0",
    "django-redis>=6.0.0",
    "redis>=5.0.0",
    "pywebpush>=2.0",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "django-filter>=25.2",
    "django-simple-captcha>=0.6.2",
    "sentry-sdk>=2.0.0",
    "django-storages[s3]>=1.14",
    "python-json-logger>=2.0.0",
    "ai-client",
]

[tool.uv.sources]
ai-client = { path = "sdk/python" }

[tool.setuptools.packages.find]
include = ["exbook*", "accounts*", "books*", "deals*", "core*", "config*", "tests*"]

[project.optional-dependencies]
prod = [
    "gunicorn>=23.0",
    "gevent>=24.0",
    "mysqlclient>=2.2",
]

# uv dependency-groups：dev 預設安裝（uv sync）；test 用 uv run --group test
[dependency-groups]
dev = [
    "django-debug-toolbar",
    "djlint",
    "ruff",
]
test = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-playwright>=0.5.0",
    "factory-boy>=3.3",
    "faker>=30.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "exbook.test_settings"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]


[tool.ruff]
# 一次性開發/驗證腳本不列入 lint。
# 已知限制：實測 ruff 0.15.12 的 exclude 對 scripts 無任意深度錨定選項
# （"scripts" 匹配任意層級、"/scripts" 與 "scripts/*" 皆不符合預期），
# 未來若出現 tests/scripts/ 等路徑需改用明示檔案清單
extend-exclude = ["scripts"]

[tool.djlint]
profile = "django"
