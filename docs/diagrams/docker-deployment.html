<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker 部署架構 — Exbooks</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="diagram.css">
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Exbooks</p>
    <h1>Docker 部署架構</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="docker-deployment-title docker-deployment-desc">
        <title id="docker-deployment-title">Docker 部署架構</title>
        <desc id="docker-deployment-desc">使用者請求經 Nginx 反向代理（:80）轉發給 Django 應用容器（Gunicorn :8000），再連線至 MariaDB 資料庫容器（:3306）；Django 把背景任務寫入 Redis broker，由 Celery worker（×2）與 beat 消費；Django 同時讀寫 static 與 media 兩個 volume。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f766e"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d4ed8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f2f2f7"/>

        <!-- ============ ARROWS (drawn before boxes) ============ -->

        <!-- User → Nginx (external/HTTP) -->
        <line x1="480" y1="100" x2="480" y2="166" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="492" y="116" width="56" height="16" fill="#f2f2f7"/>
        <text x="520" y="128" text-anchor="middle" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="12" font-weight="500" fill="#1d4ed8">HTTPS</text>

        <!-- Nginx → Django -->
        <line x1="480" y1="236" x2="480" y2="286" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="492" y="248" width="108" height="16" fill="#f2f2f7"/>
        <text x="546" y="260" text-anchor="middle" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="12" font-weight="500" fill="#526175">proxy_pass :8000</text>

        <!-- Django → MariaDB -->
        <line x1="480" y1="364" x2="480" y2="406" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="492" y="372" width="88" height="16" fill="#f2f2f7"/>
        <text x="536" y="384" text-anchor="middle" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="12" font-weight="500" fill="#526175">SQL :3306</text>

        <!-- Django → static volume (dashed, straight) -->
        <line x1="572" y1="324" x2="678" y2="324" stroke="#526175" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="596" y="332" width="76" height="16" fill="#f2f2f7"/>
        <text x="634" y="344" text-anchor="middle" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="12" font-weight="500" fill="#526175">collectstatic</text>

        <!-- Django → media volume (dashed, two-bend elbow, r=8) -->
        <path d="M 572,348 H 628 Q 636,348 636,356 V 372 Q 636,380 644,380 H 678"
              fill="none" stroke="#526175" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="596" y="388" width="64" height="16" fill="#f2f2f7"/>
        <text x="628" y="400" text-anchor="middle" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="12" font-weight="500" fill="#526175">media 上傳</text>

        <!-- Django → Redis (dashed, two-bend elbow, r=8) -->
        <path d="M 572,356 H 582 Q 590,356 590,364 V 456 Q 590,464 598,464 H 678"
              fill="none" stroke="#526175" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Redis → Celery -->
        <line x1="760" y1="488" x2="760" y2="518" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="772" y="494" width="60" height="16" fill="#f2f2f7"/>
        <text x="802" y="506" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="12" font-weight="500" fill="#526175">consume</text>

        <!-- Celery → MariaDB (solid, bottom route) -->
        <path d="M 684,556 H 488 Q 480,556 480,548 V 482"
              fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="556" y="542" width="80" height="16" fill="#f2f2f7"/>
        <text x="596" y="554" text-anchor="middle" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="12" font-weight="500" fill="#526175">SQL :3306</text>

        <!-- ============ NODES ============ -->

        <!-- User (input) -->
        <rect x="416" y="52" width="128" height="48" rx="6" fill="rgba(71,85,105,0.10)" stroke="#526175" stroke-width="1"/>
        <text x="480" y="72" text-anchor="middle" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="12" font-weight="600" fill="#0f172a">使用者</text>
        <text x="480" y="88" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#475569">Browser</text>

        <!-- Nginx (external) -->
        <rect x="396" y="172" width="168" height="64" rx="6" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1"/>
        <text x="480" y="198" text-anchor="middle" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="12" font-weight="600" fill="#0f172a">Nginx</text>
        <text x="480" y="216" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#475569">nginx:alpine · :80</text>

        <!-- Django (focal / backend) -->
        <rect x="388" y="292" width="184" height="72" rx="6" fill="rgba(13,148,136,0.08)" stroke="#0f766e" stroke-width="1.2"/>
        <text x="480" y="314" text-anchor="middle" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="12" font-weight="600" fill="#0f172a">Django</text>
        <text x="480" y="332" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#475569">Gunicorn · :8000</text>
        <text x="480" y="350" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#475569">auto migrate + collectstatic</text>

        <!-- MariaDB (store) -->
        <rect x="396" y="412" width="168" height="64" rx="6" fill="rgba(15,23,42,0.05)" stroke="#475569" stroke-width="1"/>
        <text x="480" y="438" text-anchor="middle" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="12" font-weight="600" fill="#0f172a">MariaDB</text>
        <text x="480" y="456" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#475569">10.11 · :3306</text>

        <!-- static volume (optional) -->
        <rect x="684" y="300" width="152" height="48" rx="6" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="760" y="322" text-anchor="middle" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="12" font-weight="600" fill="#0f172a">static volume</text>
        <text x="760" y="338" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#475569">/staticfiles</text>

        <!-- media volume (optional) -->
        <rect x="684" y="356" width="152" height="48" rx="6" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="760" y="378" text-anchor="middle" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="12" font-weight="600" fill="#0f172a">media volume</text>
        <text x="760" y="394" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#475569">/media</text>

        <!-- Redis (store) -->
        <rect x="684" y="440" width="152" height="48" rx="6" fill="rgba(15,23,42,0.05)" stroke="#475569" stroke-width="1"/>
        <text x="760" y="462" text-anchor="middle" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="12" font-weight="600" fill="#0f172a">Redis</text>
        <text x="760" y="478" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#475569">7-alpine · :6379 broker</text>

        <!-- Celery (worker) -->
        <rect x="684" y="524" width="152" height="48" rx="6" fill="rgba(29,78,216,0.05)" stroke="#1d4ed8" stroke-width="1"/>
        <text x="760" y="546" text-anchor="middle" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="12" font-weight="600" fill="#0f172a">Celery</text>
        <text x="760" y="562" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#475569">worker -c 2 + beat</text>

        <!-- ============ LEGEND (bottom strip) ============ -->
        <line x1="40" y1="656" x2="920" y2="656" stroke="rgba(15,23,42,0.12)" stroke-width="1"/>
        <rect x="56" y="672" width="14" height="14" rx="3" fill="rgba(13,148,136,0.08)" stroke="#0f766e" stroke-width="1"/>
        <text x="80" y="683" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="11" fill="#475569">焦點節點</text>
        <rect x="180" y="672" width="14" height="14" rx="3" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1"/>
        <text x="204" y="683" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="11" fill="#475569">反向代理</text>
        <rect x="308" y="672" width="14" height="14" rx="3" fill="rgba(15,23,42,0.05)" stroke="#475569" stroke-width="1"/>
        <text x="332" y="683" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="11" fill="#475569">資料庫</text>
        <rect x="424" y="672" width="14" height="14" rx="3" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="448" y="683" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="11" fill="#475569">儲存卷</text>
        <rect x="540" y="672" width="14" height="14" rx="3" fill="rgba(29,78,216,0.05)" stroke="#1d4ed8" stroke-width="1"/>
        <text x="564" y="683" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="11" fill="#475569">背景工作</text>
        <line x1="652" y1="679" x2="676" y2="679" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="684" y="683" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="11" fill="#475569">外部流量</text>
        <line x1="776" y1="679" x2="800" y2="679" stroke="#526175" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="808" y="683" font-family="'Work Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="11" fill="#475569">檔案讀寫</text>
      </svg>
    </div>
  </div>
</body>
</html>
