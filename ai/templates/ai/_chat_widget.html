{% load ai_chat %}<div x-data="chatWidget('{{ user.pk|escapejs }}', '{% url "account_logout" %}')"
     @keydown.escape.window="isOpen && setOpen(false)"
     class="fixed bottom-6 right-6 z-50 font-sans">
    <!-- Alpine 3 會自動呼叫 init()，不要再加 x-init="init()"（會跑兩次） -->
    <!-- 開關由右下角的米豆小版承擔（pixel-pet.js bindOpenChat），此 div 只當聊天視窗的錨點 -->

    <!-- 聊天視窗 -->
    <div x-show="isOpen"
         role="dialog"
         aria-label="米豆聊天助理"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-10 scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 scale-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0 scale-100"
         x-transition:leave-end="opacity-0 translate-y-10 scale-95"
         class="absolute bottom-20 right-0 w-[400px] max-w-[calc(100vw-3rem)] sm:h-[600px] h-[calc(100dvh-10rem)] bg-white rounded-2xl shadow-xl border border-slate-200 flex flex-col overflow-hidden"
         style="display: none;">
        
        <!-- Header：米豆大版（白底，跟全站一致） -->
        <div class="bg-white p-3 pl-6 flex justify-between items-center border-b border-slate-200">
            <div class="mipet-header-bar" data-mipet-root data-mipet-size="large"></div>
            <div class="flex gap-1">
                <button @click="clearHistory()" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors" title="清除對話" aria-label="清除對話">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>
                <button @click="setOpen(false)" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors" title="關閉" aria-label="關閉">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- 訊息區 -->
        <div id="chat-messages"
             role="log"
             aria-live="polite"
             aria-label="對話內容"
             class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50"
             x-ref="messageContainer">
            
            <template x-for="(msg, index) in messages" :key="index">
                <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
                    <div :class="msg.role === 'user' ? 'bg-primary text-white rounded-2xl rounded-tr-md' : 'bg-white text-slate-800 border border-slate-200 rounded-2xl rounded-tl-md'"
                         class="max-w-[80%] p-3 text-sm leading-relaxed">
                        <div x-text="msg.content" class="whitespace-pre-line"></div>
                        
                        <!-- 敏感操作確認 -->
                        <template x-if="msg.type === 'consent'">
                            <div class="mt-3 flex gap-2">
                                <button @click="sendAction(msg, 'confirm')"
                                        :disabled="msg.consentState !== 'pending' || !msg.token"
                                        class="px-3 py-1 bg-primary text-white rounded-lg text-xs font-medium hover:bg-secondary transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                                    確認
                                </button>
                                <button @click="sendAction(msg, 'cancel')"
                                        :disabled="msg.consentState !== 'pending' || !msg.token"
                                        class="px-3 py-1 bg-slate-200 text-slate-700 rounded-lg text-xs font-medium hover:bg-slate-300 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                                    取消
                                </button>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- 回覆中指示 -->
            <template x-if="isTyping">
                <div class="flex justify-start" role="status" aria-label="米豆正在回覆">
                    <div class="bg-white border border-slate-200 rounded-2xl rounded-tl-md p-3">
                        <div class="flex gap-1">
                            <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0ms"></span>
                            <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 150ms"></span>
                            <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 300ms"></span>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- 輸入區 -->
        <div class="p-4 bg-white border-t border-slate-200">
            <form @submit.prevent="sendMessage()" class="flex gap-2">
                <input type="text"
                       x-ref="input"
                       x-model="userInput"
                       :disabled="isTyping"
                       maxlength="1000"
                       aria-label="輸入要問米豆的訊息"
                       placeholder="有什麼想問的？"
                       class="flex-1 px-3 py-2 border border-slate-300 rounded-full bg-slate-50 focus:ring-2 focus:ring-primary/40 focus:border-primary outline-none text-sm text-slate-800 placeholder:text-slate-400 transition-colors disabled:bg-slate-100 disabled:cursor-not-allowed">
                <button type="submit"
                        aria-label="送出訊息"
                        :disabled="!userInput.trim() || isTyping"
                        class="bg-primary text-white p-2.5 rounded-full hover:bg-secondary transition-colors disabled:bg-slate-300 disabled:cursor-not-allowed">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                    </svg>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
// D3：模型（BIRC-LLM）有強 Markdown 偏好——5 輪真實量測，每個清單型
// 答案都帶 ** 粗體段標，prompt-only（規則／負例／few-shot 共 5 版）都
// 壓不掉。氣泡是 x-text 純文字渲染（防 XSS 契約），所以不渲染 Markdown，
// 改在顯示前把記號剥掉。純文字函式：不碰「喵」彩蛋的 ASCII art
// （無 **/#/>/`/| 開頭）與使用者輸入。
//
// 邊界紀律（實測誤傷/漏剝的修復）：
// 1. 表格行只在「表格」內扁平化——連續 | 行且含 |---| 分隔線的塊；
//    單立的 |a| = |b|（絕對值式）不是表格，內容不得被改寫。
// 2. 行首 > 只在「>+空白」時才剝；行首 >>>（REPL/shell 提示）不吃字元。
// 3. ``` 代碼塊內部不剥反引號/表格/引用（inline-code regex 會把 fence
//    拆成孤立反引號＋裸露原始碼）；只移除兩條 fence 行。
// 4. ** 粗體可跨單行換行，但不跨空行段落界（CommonMark 的 emphasis
//    同樣不跨段）。
function _stripInlineLine(line) {
    return line
        .replace(/^#{1,6}\s+/, '')                     // ### 標題
        .replace(/^>\s+/, '')                          // > 引用（只 >+空白）
        .replace(/`([^\n]*)`/g, '$1');                 // `行內代碼`
}

function _isTableRowish(line) {
    return /^[ \t]*\|.+\|[ \t]*$/.test(line);
}

function _isTableSeparatorLine(line) {
    return /^[ \t]*\|(?:[ \t]*:?-{2,}:?[ \t]*\|)+[ \t]*$/.test(line);
}

function _flattenTableRow(line) {
    const body = line.replace(/^[ \t]*\|/, '').replace(/\|[ \t]*$/, '');
    return body.replace(/[ \t]*\|[ \t]*/g, ' ').trim();
}

function stripMarkdown(text) {
    if (typeof text !== 'string') return text;
    // **粗體**：整段處理——跨單行換行、不跨空行段落界
    text = text.replace(/\*\*((?:(?!\n\n)[\s\S])+?)\*\*/g, '$1');
    const out = [];
    let inCode = false;
    let pending = [];  // 連續 | 行緩衝（表格候選）
    const flushTable = () => {
        if (!pending.length) return;
        // 塊內含分隔線才是表格（扁平化、丟分隔線）；
        // 否則（如單立的絕對值式）原樣保留
        if (pending.some(_isTableSeparatorLine)) {
            for (const line of pending) {
                if (_isTableSeparatorLine(line)) continue;
                out.push(_stripInlineLine(_flattenTableRow(line)));
            }
        } else {
            out.push(...pending);
        }
        pending = [];
    };
    for (const rawLine of text.split('\n')) {
        if (/^[ \t]*```/.test(rawLine)) {              // ``` fence 行：移除，切換代碼狀態
            flushTable();
            inCode = !inCode;
            continue;
        }
        if (inCode) {
            out.push(rawLine);                          // 代碼塊內部：原樣
            continue;
        }
        const line = _stripInlineLine(rawLine);
        if (_isTableRowish(line)) {
            pending.push(line);
            continue;
        }
        flushTable();
        out.push(line);
    }
    flushTable();
    return out.join('\n');
}

// 聊天記錄依使用者分開存（同一瀏覽器換帳號不會看到別人的對話），只留最後 N 則；
// 登出時清掉所有 chat_history* key。舊版共用的 'chat_history' key 一律丟棄。
const CHAT_HISTORY_PREFIX = 'chat_history';
const CHAT_MAX_STORED = 50;
// 用戶端等待上限：由伺服器端時間預算注入（ai/services/chat_orchestrator.py CLIENT_TIMEOUT_SECONDS）
const CHAT_CLIENT_TIMEOUT_MS = {% chat_client_timeout_ms %};
const CHAT_GREETING = '嗨！我是米豆，有什麼可以幫你的嗎？';
// 所有 localStorage 存取都經過這裡：不可用（隱私模式 SecurityError、配額滿等）時
// 一律吞掉——本機紀錄只影響重新整理後的顯示，不能擋住 widget 初始化、對話或登出
const chatStorage = {
    get(key) {
        try {
            return localStorage.getItem(key);
        } catch (e) {
            return null;
        }
    },
    set(key, value) {
        try {
            localStorage.setItem(key, value);
        } catch (e) {
            // 配額滿或不可用
        }
    },
    remove(key) {
        try {
            localStorage.removeItem(key);
        } catch (e) {
            // 不可用
        }
    },
    removeByPrefix(prefix) {
        try {
            const keys = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith(prefix)) keys.push(key);
            }
            keys.forEach((key) => localStorage.removeItem(key));
        } catch (e) {
            // 不可用
        }
    },
};

function clearChatStorage() {
    chatStorage.removeByPrefix(CHAT_HISTORY_PREFIX);
}

// 登出時清掉本機聊天記錄：登出可能是 POST 表單或連結，兩種都接
function bindChatLogoutCleanup(logoutUrl) {
    if (window.__chatLogoutCleanupBound) return;
    window.__chatLogoutCleanupBound = true;
    const logoutPath = new URL(logoutUrl, window.location.origin).pathname;
    const isLogout = (url) => {
        try {
            return new URL(url, window.location.origin).pathname === logoutPath;
        } catch (e) {
            return false;
        }
    };
    document.addEventListener('submit', (e) => {
        const form = e.target;
        if (form instanceof HTMLFormElement && isLogout(form.getAttribute('action') || window.location.href)) {
            clearChatStorage();
        }
    }, true);
    document.addEventListener('click', (e) => {
        const link = e.target instanceof Element ? e.target.closest('a[href]') : null;
        if (link && isLogout(link.getAttribute('href'))) clearChatStorage();
    }, true);
}

function chatWidget(userId, logoutUrl) {
    return {
        isOpen: false,
        userInput: '',
        messages: [],
        isTyping: false,
        storageKey: `${CHAT_HISTORY_PREFIX}:${userId}`,

        init() {
            // 舊版不分使用者的共用 key：可能是別的帳號的對話，直接丟棄
            chatStorage.remove(CHAT_HISTORY_PREFIX);
            this.loadHistory();
            bindChatLogoutCleanup(logoutUrl);
            // 米豆小版取代原紫色按鈕：點貓開關聊天視窗
            window.MiPet?.bindOpenChat?.(() => this.toggleChat());
        },

        toggleChat() {
            this.setOpen(!this.isOpen);
        },

        setOpen(open) {
            this.isOpen = open;
            // 聊天視窗打開時，小版讓位給視窗內的大版
            document.documentElement.classList.toggle('mipet-chat-open', open);
            if (!open) return;
            // 問候語在本機產生，輸入框不依賴任何長連線
            if (!this.messages.length) this.addMessage('assistant', CHAT_GREETING);
            // 打開路徑自己負責捲到底部並聚焦輸入框
            this.$nextTick(() => {
                this.scrollToBottom();
                this.$refs.input?.focus();
            });
        },

        async sendMessage() {
            const text = this.userInput.trim();
            if (!text || this.isTyping) return;
            window.MiPet?.setState?.('thinking');

            this.addMessage('user', text);
            this.userInput = '';
            this.isTyping = true;

            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), CHAT_CLIENT_TIMEOUT_MS);
            let gotContent = false;
            let gotDone = false;

            try {
                const response = await fetch('{% url "ai:chat_sse" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': this.getCookie('csrftoken')
                    },
                    body: JSON.stringify({ message: text }),
                    signal: controller.signal,
                });

                if (!response.ok) {
                    // 400／429 帶有中文錯誤訊息，直接顯示給使用者
                    const err = await response.json().catch(() => ({}));
                    window.MiPet?.setState?.('error');
                    this.addMessage('assistant', err.error || '訊息送出失敗，請稍後再試。', 'notice');
                    return;
                }

                // POST 回傳 SSE 串流：邊讀邊處理，talking 才有機會被畫出來
                // （先 await response.text() 會把整段讀完，thinking→talking 併成同一個 frame）
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buf = '';
                const handle = ({ event, data }) => {
                    if (event === 'content' && data.delta) {
                        if (!gotContent) window.MiPet?.setState?.('talking');
                        gotContent = true;
                        // 每個內容片段讓米豆的嘴巴跟著動一下
                        window.MiPet?.pulse?.();
                        this.addMessage('assistant', data.delta, 'text');
                    } else if (event === 'consent_required') {
                        this.addMessage('assistant', this.formatConsent(data), 'consent', data.token, data.tool);
                    } else if (event === 'done') {
                        gotDone = true;
                    }
                };

                for (;;) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buf += decoder.decode(value, { stream: true });
                    const parts = buf.split('\n\n');
                    buf = parts.pop();
                    for (const part of parts) this.parseSSE(part).forEach(handle);
                }
                if (buf.trim()) this.parseSSE(buf).forEach(handle);

                if (!gotDone && !gotContent) {
                    window.MiPet?.setState?.('error');
                    this.addMessage('assistant', '回覆中斷了，請再試一次。', 'notice');
                } else {
                    window.MiPet?.cheer?.();
                }
            } catch (error) {
                window.MiPet?.setState?.('error');
                const timedOut = error && error.name === 'AbortError';
                this.addMessage(
                    'assistant',
                    timedOut ? '等太久了，這次回覆先停止，請再試一次。' : '訊息送出失敗，請檢查網路後再試一次。',
                    'notice'
                );
            } finally {
                // 不論串流怎麼結束（有沒有 done、斷線、逾時），輸入框都要解鎖
                clearTimeout(timer);
                this.isTyping = false;
                this.$nextTick(() => this.$refs.input?.focus());
            }
        },

        formatConsent(data) {
            // description 由伺服器（consent_labels.describe_consent）一律提供，前端不另備對照表
            return `確認要${data.description}嗎？`;
        },

        parseSSE(text) {
            const events = [];
            const rawEvents = text.trim().split('\n\n');
            for (const rawEvent of rawEvents) {
                if (!rawEvent.trim()) continue;
                const lines = rawEvent.split('\n');
                let eventName = 'message';
                let dataStr = '';
                for (const line of lines) {
                    if (line.startsWith('event: ')) {
                        eventName = line.slice(7);
                    } else if (line.startsWith('data: ')) {
                        dataStr = line.slice(6);
                    }
                }
                try {
                    events.push({ event: eventName, data: JSON.parse(dataStr) });
                } catch (e) {
                    events.push({ event: eventName, data: dataStr });
                }
            }
            return events;
        },

        async sendAction(msg, action) {
            // 每個氣泡帶自己的 token（one-shot）與狀態：舊氣泡不再誤用新 token，
            // sending 防雙點重覆 POST，done/failed/無 token 時按鈕停用
            if (msg.consentState !== 'pending' || !msg.token) return;
            const confirmed = action === 'confirm';
            msg.consentState = 'sending';
            let data = {};
            let ok = false;
            try {
                const url = '{% url "ai:chat_consent" action="__tool__" %}'.replace('__tool__', encodeURIComponent(msg.tool));
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': this.getCookie('csrftoken')
                    },
                    body: JSON.stringify({ confirmed, token: msg.token })
                });
                data = await response.json().catch(() => ({}));
                ok = response.ok;
            } catch (error) {
                ok = false;
            }
            // 伺服器一收到請求就作廢 token：不論成敗都不能重試
            msg.token = null;
            if (ok) {
                msg.consentState = 'done';
                this.addMessage('user', confirmed ? '確認' : '取消');
                if (confirmed) {
                    this.addMessage('assistant', typeof data.result === 'string' && data.result ? data.result : '已完成。', 'text');
                } else {
                    this.addMessage('assistant', '好的，已取消這項操作。', 'notice');
                }
            } else {
                msg.consentState = 'failed';
                this.addMessage(
                    'assistant',
                    `${data.error || '這項操作沒有完成。'}如果還需要，請再問米豆一次。`,
                    'notice'
                );
            }
            this.persist();
        },

        addMessage(role, content, type = 'text', token = null, tool = null) {
            // D3：LLM 文字在顯示前剥掉 Markdown 記號（氣泡是 x-text 純文字渲染）
            if (role === 'assistant' && type === 'text') {
                content = stripMarkdown(content);
            }
            this.messages.push({ role, content, type, tool, token, consentState: type === 'consent' ? 'pending' : null });
            if (this.messages.length > CHAT_MAX_STORED) {
                this.messages.splice(0, this.messages.length - CHAT_MAX_STORED);
            }
            this.persist();
            this.$nextTick(() => this.scrollToBottom());
        },

        persist() {
            // token 不寫入 localStorage：重新載入後舊 consent 氣泡自然失效
            const toPersist = this.messages.slice(-CHAT_MAX_STORED).map(({ token: _t, ...rest }) => rest);
            chatStorage.set(this.storageKey, JSON.stringify(toPersist));
        },

        clearHistory() {
            this.messages = [];
            chatStorage.remove(this.storageKey);
            fetch('{% url "ai:chat_clear" %}', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': this.getCookie('csrftoken')
                }
            });
        },

        scrollToBottom() {
            const container = this.$refs.messageContainer;
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        },

        loadHistory() {
            const raw = chatStorage.get(this.storageKey);
            if (!raw) return;
            // 損壞的 history（非 JSON / 非陣列）不得拋錯殺掉 bindOpenChat：
            // 讀不出來就丟棄重新開始
            try {
                const parsed = JSON.parse(raw);
                this.messages = Array.isArray(parsed) ? parsed.slice(-CHAT_MAX_STORED) : [];
            } catch (e) {
                chatStorage.remove(this.storageKey);
                this.messages = [];
            }
        },

        getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    }
}
</script>
<!--
  🐱 彩蛋觸發方式：
  在聊天框輸入「喵」或「cat」，AI 會給你一個特別的回應～
  這是給細心使用者的驚喜 ✨
-->
