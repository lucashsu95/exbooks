<div x-data="chatWidget()" 
     x-init="init()" 
     class="fixed bottom-6 right-6 z-50 font-sans">
    
    <!-- 開關由右下角的米豆小版承擔（pixel-pet.js bindOpenChat），此 div 只當聊天視窗的錨點 -->

    <!-- Chat Window -->
    <div x-show="isOpen" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-10 scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 scale-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0 scale-100"
         x-transition:leave-end="opacity-0 translate-y-10 scale-95"
         class="absolute bottom-20 right-0 w-[400px] max-w-[calc(100vw-3rem)] sm:h-[600px] h-[calc(100vh-10rem)] bg-white rounded-2xl shadow-2xl border border-gray-100 flex flex-col overflow-hidden"
         style="display: none;">
        
        <!-- Header -->
        <div class="bg-indigo-600 p-4 text-white flex justify-between items-center shadow-md">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <div class="w-10 h-10 bg-indigo-400 rounded-full flex items-center justify-center text-xl font-bold">AI</div>
                    <div :class="isConnected ? 'bg-green-400' : 'bg-gray-400'" class="absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-white"></div>
                </div>
                <div>
                    <h3 class="font-semibold leading-tight">Exbooks Assistant</h3>
                    <p class="text-xs text-indigo-100" x-text="connectionStatus"></p>
                </div>
            </div>
            <div class="flex gap-2">
                <button @click="clearHistory()" class="p-2 hover:bg-indigo-500 rounded-lg transition-colors" title="Clear History">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>
                <button @click="toggleChat()" class="p-2 hover:bg-indigo-500 rounded-lg transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- 米豆 MeDou 大版（顯示在聊天視窗內，隨 SSE 狀態變化） -->
        <div class="mipet-large-bar flex items-center gap-3 px-4 py-2 bg-white border-b border-gray-100">
            <div data-mipet-root data-mipet-size="large"></div>
        </div>

        <!-- Messages Area -->
        <div id="chat-messages" 
             class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50"
             x-ref="messageContainer">
            
            <template x-for="(msg, index) in messages" :key="index">
                <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
                    <div :class="msg.role === 'user' ? 'bg-indigo-600 text-white rounded-l-xl rounded-tr-xl' : 'bg-white text-gray-800 border border-gray-200 rounded-r-xl rounded-tl-xl'"
                         class="max-w-[80%] p-3 shadow-sm text-sm leading-relaxed">
                        <div x-text="msg.content"></div>
                        
                        <!-- Consent Action -->
                        <template x-if="msg.type === 'consent'">
                                        <div class="mt-3 flex gap-2">
                                            <button @click="sendAction(msg, 'confirm')"
                                                    :disabled="msg.consentState !== 'pending' || !msg.token"
                                                    class="px-3 py-1 bg-green-500 text-white rounded-md text-xs font-medium hover:bg-green-600 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                                                Confirm
                                            </button>
                                            <button @click="sendAction(msg, 'cancel')"
                                                    :disabled="msg.consentState !== 'pending' || !msg.token"
                                                    class="px-3 py-1 bg-gray-400 text-white rounded-md text-xs font-medium hover:bg-gray-500 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                                                Cancel
                                            </button>
                                        </div>
                                    </template>
                    </div>
                </div>
            </template>

            <!-- Typing Indicator -->
            <template x-if="isTyping">
                <div class="flex justify-start">
                    <div class="bg-white border border-gray-200 rounded-r-xl rounded-tl-xl p-3 shadow-sm">
                        <div class="flex gap-1">
                            <span class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0ms"></span>
                            <span class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 150ms"></span>
                            <span class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 300ms"></span>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-white border-t border-gray-100">
            <form @submit.prevent="sendMessage()" class="flex gap-2">
                <input type="text" 
                       x-model="userInput" 
                       :disabled="!isConnected || isTyping"
                       placeholder="Ask me anything..." 
                       class="flex-1 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none text-sm transition-all disabled:bg-gray-100 disabled:cursor-not-allowed">
                <button type="submit" 
                        :disabled="!userInput.trim() || !isConnected || isTyping"
                        class="bg-indigo-600 text-white p-2 rounded-lg hover:bg-indigo-700 transition-colors disabled:bg-gray-300 disabled:cursor-not-allowed">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                    </svg>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
function chatWidget() {
    return {
        isOpen: false,
        isConnected: false,
        connectionStatus: 'Disconnected',
        userInput: '',
        messages: [],
        isTyping: false,
        eventSource: null,

        init() {
            this.loadHistory();
            // 米豆小版取代原紫色按鈕：點貓開關聊天視窗
            window.MiPet?.bindOpenChat(() => this.toggleChat());
            this.updateSseDot();
            // SSE 延遲到用戶主動打開聊天視窗時才連線，
            // 避免每個頁面都佔用一個 Gunicorn sync worker
        },

        toggleChat() {
            this.isOpen = !this.isOpen;
            // 聊天視窗打開時，小版讓位給視窗內的大版
            document.documentElement.classList.toggle('mipet-chat-open', this.isOpen);
            if (this.isOpen && !this.eventSource) {
                this.connectSSE();
            }
            // 關閉聊天時斷開 SSE，釋放 worker
            if (!this.isOpen && this.eventSource) {
                this.eventSource.close();
                this.eventSource = null;
                this.isConnected = false;
                this.connectionStatus = 'Disconnected';
            }
            this.updateSseDot();
        },

        // 還原原紫色按鈕的斷線指示：視窗關閉且 SSE 未連線時顯示紅點
        // （.mipet-sse-offline class 由 pixel-pet 模組擁有）
        updateSseDot() {
            window.MiPet?.setSseOffline(!this.isOpen && !this.isConnected);
        },

        connectSSE() {
            this.connectionStatus = 'Connecting...';
            this.eventSource = new EventSource('/ai/chat/');

            // 頁面卸載時主動關閉，避免殘留連線佔用 worker
            window.addEventListener('beforeunload', () => {
                if (this.eventSource) {
                    this.eventSource.close();
                    this.eventSource = null;
                }
            });

            this.eventSource.addEventListener('connection', (e) => {
                const data = JSON.parse(e.data);
                if (data.status === 'connected') {
                    this.isConnected = true;
                    this.connectionStatus = 'Online';
                    this.addMessage('assistant', 'Hello! How can I help you today?');
                    this.updateSseDot();
                }
            });

            this.eventSource.addEventListener('message', (e) => {
                const data = JSON.parse(e.data);
                this.isTyping = data.status === 'typing';
                if (data.delta) {
                    this.addMessage('assistant', data.delta, 'text');
                }
                if (data.type === 'content' && data.delta) {
                    this.addMessage('assistant', data.delta, 'text');
                }
            });

            this.eventSource.addEventListener('content', (e) => {
                const data = JSON.parse(e.data);
                if (data.delta) {
                    this.addMessage('assistant', data.delta, 'text');
                }
            });

            this.eventSource.addEventListener('consent_required', (e) => {
                const data = JSON.parse(e.data);
                this.addMessage('assistant', this.formatConsent(data), 'consent', data.token, data.tool);
            });

            this.eventSource.addEventListener('error', (e) => {
                this.isConnected = false;
                this.connectionStatus = 'Connection Error';
                console.error('SSE Error:', e);
                window.MiPet?.setState('error');
                this.updateSseDot();
            });

            this.eventSource.addEventListener('done', () => {
                this.isTyping = false;
            });
        },

        async sendMessage() {
            if (!this.userInput.trim()) return;
            window.MiPet?.setState('thinking');

            const text = this.userInput;
            this.addMessage('user', text);
            this.userInput = '';
            this.isTyping = true;

            try {
                const response = await fetch('/ai/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': this.getCookie('csrftoken')
                    },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) throw new Error('Failed to send message');

                // POST 回傳 SSE 串流：邊讀邊處理，talking 才有機會被畫出來
                // （先 await response.text() 會把整段讀完，thinking→talking 併成同一個 frame）
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buf = '';
                let talked = false;
                const handle = ({ event, data }) => {
                    if (event === 'content' && data.delta) {
                        if (!talked) {
                            window.MiPet?.setState('talking');
                            talked = true;
                        }
                        this.addMessage('assistant', data.delta, 'text');
                    } else if (event === 'consent_required') {
                        this.addMessage('assistant', this.formatConsent(data), 'consent', data.token, data.tool);
                    } else if (event === 'tool_result') {
                        this.addMessage('assistant', `Tool result: ${data.error ?? data.result}`, 'text');
                    } else if (event === 'done') {
                        this.isTyping = false;
                    }
                };

                for (;;) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buf += decoder.decode(value, { stream: true });
                    const parts = buf.split('\n\n');
                    buf = parts.pop();
                    for (const part of parts) this.parseSSE(part).forEach(handle);
                }
                if (buf.trim()) this.parseSSE(buf).forEach(handle);
                window.MiPet?.cheer();
            } catch (error) {
                window.MiPet?.setState('error');
                this.addMessage('assistant', 'Sorry, I encountered an error sending your message.');
                this.isTyping = false;
            }
        },

        formatConsent(data) {
            const args = data.args ? Object.entries(data.args).map(([k, v]) => `${k}=${v}`).join(', ') : '';
            return `Confirm ${data.tool}(${args})?`;
        },

        parseSSE(text) {
            const events = [];
            const rawEvents = text.trim().split('\n\n');
            for (const rawEvent of rawEvents) {
                if (!rawEvent.trim()) continue;
                const lines = rawEvent.split('\n');
                let eventName = 'message';
                let dataStr = '';
                for (const line of lines) {
                    if (line.startsWith('event: ')) {
                        eventName = line.slice(7);
                    } else if (line.startsWith('data: ')) {
                        dataStr = line.slice(6);
                    }
                }
                try {
                    events.push({ event: eventName, data: JSON.parse(dataStr) });
                } catch (e) {
                    events.push({ event: eventName, data: dataStr });
                }
            }
            return events;
        },

        async sendAction(msg, action) {
            // 每個氣泡帶自己的 token（one-shot）與狀態：舊氣泡不再誤用新 token，
            // sending 防雙點重覆 POST，done/無 token 時按鈕停用
            if (msg.consentState !== 'pending' || !msg.token) return;
            msg.consentState = 'sending';
            try {
                const response = await fetch(`/ai/chat/consent/${msg.tool}/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': this.getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        confirmed: action === 'confirm',
                        token: msg.token
                    })
                });
                if (!response.ok) throw new Error('Action failed');
                this.addMessage('user', action === 'confirm' ? 'Confirmed' : 'Cancelled');
                msg.consentState = 'done';
                msg.token = null;
            } catch (error) {
                msg.consentState = 'pending';  // 失敗還原，可重試
                this.addMessage('assistant', 'Error processing your action.');
            }
        },

        addMessage(role, content, type = 'text', token = null, tool = null) {
            // Prevent duplicate hello messages if already in history
            if (content === 'Hello! How can I help you today?' && this.messages.some(m => m.content === content)) {
                return;
            }
            this.messages.push({ role, content, type, tool, token, consentState: type === 'consent' ? 'pending' : null });
            // token 不寫入 localStorage：重新載入後舊 consent 氣泡自然失效
            const toPersist = this.messages.map(({ token: _t, ...rest }) => rest);
            localStorage.setItem('chat_history', JSON.stringify(toPersist));
            this.$nextTick(() => {
                const container = this.$refs.messageContainer;
                if (container) {
                    container.scrollTop = container.scrollHeight;
                }
            });
        },

        clearHistory() {
            this.messages = [];
            localStorage.removeItem('chat_history');
            fetch('/ai/chat/clear/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': this.getCookie('csrftoken')
                }
            });
        },

        loadHistory() {
            const history = localStorage.getItem('chat_history');
            if (history) {
                this.messages = JSON.parse(history);
            }
        },

        getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    }
}
</script>

  🐱 彩蛋觸發方式：
  在聊天框輸入「喵」或「cat」，AI 會給你一個特別的回應～
  這是給細心使用者的驚喜 ✨
