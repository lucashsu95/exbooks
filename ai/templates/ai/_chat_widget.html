<div x-data="chatWidget()" 
     x-init="init()" 
     class="fixed bottom-6 right-6 z-50 font-sans">
    
    <!-- 開關由右下角的米豆小版承擔（pixel-pet.js bindOpenChat），此 div 只當聊天視窗的錨點 -->

    <!-- Chat Window -->
    <div x-show="isOpen" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-10 scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 scale-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0 scale-100"
         x-transition:leave-end="opacity-0 translate-y-10 scale-95"
         class="absolute bottom-20 right-0 w-[400px] max-w-[calc(100vw-3rem)] sm:h-[600px] h-[calc(100vh-10rem)] bg-white rounded-2xl shadow-xl border border-slate-200 flex flex-col overflow-hidden"
         style="display: none;">
        
        <!-- Header：米豆大版（白底，跟全站一致） -->
        <div class="bg-white p-3 pl-6 flex justify-between items-center border-b border-slate-200">
            <div class="mipet-header-bar" data-mipet-root data-mipet-size="large"></div>
            <div class="flex gap-1">
                <button @click="clearHistory()" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors" title="清除對話" aria-label="清除對話">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>
                <button @click="toggleChat()" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors" title="關閉" aria-label="關閉">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Messages Area -->
        <div id="chat-messages" 
             class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50"
             x-ref="messageContainer">
            
            <template x-for="(msg, index) in messages" :key="index">
                <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
                    <div :class="msg.role === 'user' ? 'bg-primary text-white rounded-2xl rounded-tr-md' : 'bg-white text-slate-800 border border-slate-200 rounded-2xl rounded-tl-md'"
                         class="max-w-[80%] p-3 text-sm leading-relaxed">
                        <div x-text="msg.content"></div>
                        
                        <!-- Consent Action -->
                        <template x-if="msg.type === 'consent'">
                            <div class="mt-3 flex gap-2">
                                <button @click="sendAction('confirm')" 
                                        class="px-3 py-1 bg-primary text-white rounded-lg text-xs font-medium hover:bg-secondary transition-colors">
                                    確認
                                </button>
                                <button @click="sendAction('cancel')" 
                                        class="px-3 py-1 bg-slate-200 text-slate-700 rounded-lg text-xs font-medium hover:bg-slate-300 transition-colors">
                                    取消
                                </button>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Typing Indicator -->
            <template x-if="isTyping">
                <div class="flex justify-start">
                    <div class="bg-white border border-slate-200 rounded-2xl rounded-tl-md p-3">
                        <div class="flex gap-1">
                            <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0ms"></span>
                            <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 150ms"></span>
                            <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 300ms"></span>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-white border-t border-slate-200">
            <form @submit.prevent="sendMessage()" class="flex gap-2">
                <input type="text" 
                       x-model="userInput" 
                       :disabled="!isConnected || isTyping"
                       placeholder="有什麼想問的？" 
                       class="flex-1 px-3 py-2 border border-slate-300 rounded-full bg-slate-50 focus:ring-2 focus:ring-primary/40 focus:border-primary outline-none text-sm text-slate-800 placeholder:text-slate-400 transition-colors disabled:bg-slate-100 disabled:cursor-not-allowed">
                <button type="submit" 
                        :disabled="!userInput.trim() || !isConnected || isTyping"
                        class="bg-primary text-white p-2.5 rounded-full hover:bg-secondary transition-colors disabled:bg-slate-300 disabled:cursor-not-allowed">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                    </svg>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
function chatWidget() {
    return {
        isOpen: false,
        isConnected: false,
        connectionStatus: 'Disconnected',
        userInput: '',
        messages: [],
        isTyping: false,
        eventSource: null,

        init() {
            this.loadHistory();
            // 米豆小版取代原紫色按鈕：點貓開關聊天視窗
            window.MiPet?.bindOpenChat(() => this.toggleChat());
            // SSE 延遲到用戶主動打開聊天視窗時才連線，
            // 避免每個頁面都佔用一個 Gunicorn sync worker
        },

        toggleChat() {
            this.isOpen = !this.isOpen;
            // 聊天視窗打開時，小版讓位給視窗內的大版
            document.documentElement.classList.toggle('mipet-chat-open', this.isOpen);
            if (this.isOpen && !this.eventSource) {
                this.connectSSE();
            }
            // 關閉聊天時斷開 SSE，釋放 worker
            if (!this.isOpen && this.eventSource) {
                this.eventSource.close();
                this.eventSource = null;
                this.isConnected = false;
                this.connectionStatus = 'Disconnected';
            }
        },

        connectSSE() {
            this.connectionStatus = 'Connecting...';
            this.eventSource = new EventSource('/ai/chat/');

            // 頁面卸載時主動關閉，避免殘留連線佔用 worker
            window.addEventListener('beforeunload', () => {
                if (this.eventSource) {
                    this.eventSource.close();
                    this.eventSource = null;
                }
            });

            this.eventSource.addEventListener('connection', (e) => {
                const data = JSON.parse(e.data);
                if (data.status === 'connected') {
                    this.isConnected = true;
                    this.connectionStatus = 'Online';
                    this.addMessage('assistant', '嗨！我是米豆，有什麼可以幫你的嗎？');
                }
            });

            this.eventSource.addEventListener('message', (e) => {
                const data = JSON.parse(e.data);
                this.isTyping = data.status === 'typing';
                if (data.delta) {
                    this.addMessage('assistant', data.delta, 'text');
                }
                if (data.type === 'content' && data.delta) {
                    this.addMessage('assistant', data.delta, 'text');
                }
            });

            this.eventSource.addEventListener('content', (e) => {
                const data = JSON.parse(e.data);
                if (data.delta) {
                    this.addMessage('assistant', data.delta, 'text');
                }
            });

            this.eventSource.addEventListener('consent_required', (e) => {
                const data = JSON.parse(e.data);
                this.addMessage('assistant', 'This action requires your confirmation.', 'consent');
                // Store tool/args for action
                this.pendingAction = { tool: data.tool, args: data.args };
            });

            this.eventSource.addEventListener('error', (e) => {
                this.isConnected = false;
                this.connectionStatus = 'Connection Error';
                console.error('SSE Error:', e);
                window.MiPet?.setState('error');
            });

            this.eventSource.addEventListener('done', () => {
                this.isTyping = false;
            });
        },

        async sendMessage() {
            if (!this.userInput.trim()) return;
            window.MiPet?.setState('thinking');

            const text = this.userInput;
            this.addMessage('user', text);
            this.userInput = '';
            this.isTyping = true;

            try {
                const response = await fetch('/ai/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': this.getCookie('csrftoken')
                    },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) throw new Error('Failed to send message');

                // POST 回傳 SSE 串流：邊讀邊處理，talking 才有機會被畫出來
                // （先 await response.text() 會把整段讀完，thinking→talking 併成同一個 frame）
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buf = '';
                let talked = false;
                const handle = ({ event, data }) => {
                    if (event === 'content' && data.delta) {
                        if (!talked) {
                            window.MiPet?.setState('talking');
                            talked = true;
                        }
                        this.addMessage('assistant', data.delta, 'text');
                    } else if (event === 'consent_required') {
                        this.addMessage('assistant', 'This action requires your confirmation.', 'consent');
                        this.pendingAction = { tool: data.tool, args: data.args };
                    } else if (event === 'tool_result') {
                        this.addMessage('assistant', `Tool result: ${data.error ?? data.result}`, 'text');
                    } else if (event === 'done') {
                        this.isTyping = false;
                    }
                };

                for (;;) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buf += decoder.decode(value, { stream: true });
                    const parts = buf.split('\n\n');
                    buf = parts.pop();
                    for (const part of parts) this.parseSSE(part).forEach(handle);
                }
                if (buf.trim()) this.parseSSE(buf).forEach(handle);
                window.MiPet?.cheer();
            } catch (error) {
                window.MiPet?.setState('error');
                this.addMessage('assistant', 'Sorry, I encountered an error sending your message.');
                this.isTyping = false;
            }
        },

        parseSSE(text) {
            const events = [];
            const rawEvents = text.trim().split('\n\n');
            for (const rawEvent of rawEvents) {
                if (!rawEvent.trim()) continue;
                const lines = rawEvent.split('\n');
                let eventName = 'message';
                let dataStr = '';
                for (const line of lines) {
                    if (line.startsWith('event: ')) {
                        eventName = line.slice(7);
                    } else if (line.startsWith('data: ')) {
                        dataStr = line.slice(6);
                    }
                }
                try {
                    events.push({ event: eventName, data: JSON.parse(dataStr) });
                } catch (e) {
                    events.push({ event: eventName, data: dataStr });
                }
            }
            return events;
        },

        async sendAction(action) {
            try {
                const response = await fetch(`/ai/chat/consent/${this.pendingAction.tool}/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': this.getCookie('csrftoken')
                    },
                    body: JSON.stringify({ 
                        confirmed: action === 'confirm',
                        args: this.pendingAction.args
                    })
                });
                if (!response.ok) throw new Error('Action failed');
                this.addMessage('user', action === 'confirm' ? 'Confirmed' : 'Cancelled');
                this.pendingAction = null;
            } catch (error) {
                this.addMessage('assistant', 'Error processing your action.');
            }
        },

        addMessage(role, content, type = 'text') {
            // Prevent duplicate hello messages if already in history
            if (content === '嗨！我是米豆，有什麼可以幫你的嗎？' && this.messages.some(m => m.content === content)) {
                return;
            }
            this.messages.push({ role, content, type });
            localStorage.setItem('chat_history', JSON.stringify(this.messages));
            this.$nextTick(() => {
                const container = this.$refs.messageContainer;
                if (container) {
                    container.scrollTop = container.scrollHeight;
                }
            });
        },

        clearHistory() {
            this.messages = [];
            localStorage.removeItem('chat_history');
            fetch('/ai/chat/clear/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': this.getCookie('csrftoken')
                }
            });
        },

        loadHistory() {
            const history = localStorage.getItem('chat_history');
            if (history) {
                this.messages = JSON.parse(history);
            }
        },

        getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    }
}
</script>

  在聊天框輸入「喵」或「cat」，AI 會給你一個特別的回應～
  這是給細心使用者的驚喜 ✨
